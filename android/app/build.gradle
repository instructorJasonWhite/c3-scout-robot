plugins { id 'com.android.application' }

android {
    namespace 'com.scout.control'
    compileSdk 35
    defaultConfig {
        applicationId 'com.scout.control'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
