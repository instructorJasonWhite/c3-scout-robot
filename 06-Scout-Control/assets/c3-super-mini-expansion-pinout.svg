<marker id="arrow-free" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="20" markerHeight="20" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#16634a" stroke="#fffef8" stroke-width=".65" stroke-linejoin="round"/></marker>
<marker id="arrow-conditional" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="20" markerHeight="20" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#8b510a" stroke="#fffef8" stroke-width=".65" stroke-linejoin="round"/></marker>
<marker id="arrow-power" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="20" markerHeight="20" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#145987" stroke="#fffef8" stroke-width=".65" stroke-linejoin="round"/></marker>
