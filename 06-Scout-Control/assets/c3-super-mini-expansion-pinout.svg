<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="pinout-title pinout-desc">
<title id="pinout-title">Scout Carrier C v10: ESP32-C3 Super Mini expansion pinout</title>
<desc id="pinout-desc">Top component view with USB at the top, not the underside. Left row from top: GPIO5, 6, 7, 8, 9, 10, 20, 21. Right row: 5V, GND, 3V3, GPIO4, 3, 2, 1, 0. Arrows end at the corresponding pad. GPIO5, 7, 20 and 21 are available. GPIO2, 8 and 9 are conditional boot-sensitive pins. GPIO4 is connected to battery sensing.</desc>
<rect width="1280" height="1100" rx="22" fill="#fffef8"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#193f39">
<text x="40" y="53" font-size="15" letter-spacing="2">C3 SCOUT / CARRIER C v10 / EXPANSION</text>
<text x="40" y="104" font-size="39" font-weight="700">ESP32-C3 Super Mini pinout</text>
<text x="40" y="143" font-size="21">TOP / COMPONENT VIEW · USB connector at the top · The underside view is mirrored</text>
<rect x="478" y="210" width="324" height="710" rx="24" fill="#193f39" stroke="#102e28" stroke-width="3"/>
<rect x="575" y="179" width="130" height="91" rx="12" fill="#cbd6d4" stroke="#657b75" stroke-width="3"/>
<rect x="590" y="187" width="100" height="23" rx="10" fill="#233e36"/>
<text x="640" y="244" text-anchor="middle" font-size="18" font-weight="700">USB-C</text>
<rect x="566" y="410" width="148" height="175" rx="10" fill="#0c2420" stroke="#8da59b"/>
<text x="640" y="475" text-anchor="middle" font-size="22" fill="#e5ede4">ESP32</text>
<text x="640" y="509" text-anchor="middle" font-size="24" font-weight="700" fill="#e5ede4">C3</text>
<text x="640" y="548" text-anchor="middle" font-size="14" fill="#b7c9c0">SUPER MINI</text>
<text x="640" y="885" text-anchor="middle" font-size="14" fill="#b7c9c0">Simplified module drawing</text>

